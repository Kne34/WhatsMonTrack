# Render Blueprint for the API + WhatsApp bot (free plan).
# Database: Neon (free). Frontend: Vercel (free). See DEPLOY.md.
services:
  - type: web
    branch: deploy/render-neon-vercel
    name: whatsmontrack-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend/api
    # Dev dependencies (Nest CLI, Prisma CLI) are needed to build
    buildCommand: npm ci --include=dev && npm run build:render
    # Applies pending migrations (on Neon's direct connection), then starts the API
    startCommand: npm run start:render
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_OPTIONS
        value: --dns-result-order=ipv4first
      # Neon "pooled" connection string (host contains -pooler), with ?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Neon "direct" connection string, used only for migrations
      - key: MIGRATE_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      # Your Vercel URL, e.g. https://whatsmontrack.vercel.app
      - key: FRONTEND_ORIGIN
        sync: false
      # Process WhatsApp messages sent while the free instance was asleep, up to this age
      - key: WA_OFFLINE_MAX_AGE_HOURS
        value: "168"
      - key: TRUST_PROXY_HOPS
        value: "1"
      # OTP email over Brevo's HTTPS API: Render's free plan blocks outbound SMTP ports
      - key: BREVO_API_KEY
        sync: false
      # A sender address verified in Brevo, e.g. "WhatsMonTrack <you@gmail.com>"
      - key: MAIL_FROM
        sync: false
