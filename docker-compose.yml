services:
  postgres-master:
    image: bitnami/postgresql:latest
    environment:
      POSTGRESQL_USERNAME: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: ${POSTGRES_REPL_USER}
      POSTGRESQL_REPLICATION_PASSWORD: ${POSTGRES_REPL_PASSWORD}
    volumes:
      - postgres_master_data:/bitnami/postgresql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - whatsmontrack

  postgres-slave:
    image: bitnami/postgresql:latest
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_MASTER_HOST: postgres-master
      POSTGRESQL_USERNAME: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_REPLICATION_USER: ${POSTGRES_REPL_USER}
      POSTGRESQL_REPLICATION_PASSWORD: ${POSTGRES_REPL_PASSWORD}
    depends_on:
      postgres-master:
        condition: service_healthy
    volumes:
      - postgres_slave_data:/bitnami/postgresql
    networks:
      - whatsmontrack

  pgpool:
    image: mrgreen007/pgpool:latest
    restart: on-failure
    environment:
      PGPOOL_BACKEND_NODES: 0:postgres-master:5432,1:postgres-slave:5432
      PGPOOL_SR_CHECK_USER: ${POSTGRES_REPL_USER}
      PGPOOL_SR_CHECK_PASSWORD: ${POSTGRES_REPL_PASSWORD}
      PGPOOL_ENABLE_LDAP: no
      PGPOOL_POSTGRES_USERNAME: ${POSTGRES_USER}
      PGPOOL_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGPOOL_ADMIN_USERNAME: ${PGPOOL_ADMIN_USER}
      PGPOOL_ADMIN_PASSWORD: ${PGPOOL_ADMIN_PASSWORD}
    depends_on:
      postgres-master:
        condition: service_healthy
      postgres-slave:
        condition: service_started
    networks:
      - whatsmontrack

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - whatsmontrack

  gateway:
    build: ./backend/gateway
    container_name: whatsmon-gateway
    ports:
      - "3000:3000"
    volumes:
      - ./backend/gateway:/app
      - /app/node_modules
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
    networks:
      - whatsmontrack

  parser-service:
    build: ./backend/parser-service
    container_name: whatsmon-parser
    volumes:
      - ./backend/parser-service:/app
      - /app/node_modules
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NODE_OPTIONS=--dns-result-order=ipv4first
    networks:
      - whatsmontrack

  transaction-service:
    build: ./backend/transaction-service
    container_name: whatsmon-transaction
    volumes:
      - ./backend/transaction-service:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgpool:5432/postgres?schema=public
      - NODE_OPTIONS=--dns-result-order=ipv4first
    depends_on:
      - pgpool
    networks:
      - whatsmontrack

networks:
  whatsmontrack:
    driver: bridge

volumes:
  postgres_master_data:
  postgres_slave_data:
